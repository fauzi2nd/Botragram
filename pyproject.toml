[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botragram"
version = "2.7.0"
description = "Asynchronous algorithmic trading framework."
requires-python = ">=3.14"

dependencies = [
    "aiohttp>=3.14.3",
    "aiosqlite>=0.22.1",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3.0",
    "pyrefly>=1.2.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["botragram", "tests", "main.py"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["botragram", "tests", "main.py"]
exclude = [".venv"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["manual"]
addopts = "--basetemp=.pytest-runtime"
cache_dir = ".cache/pytest-runtime/cache"

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = [".venv", "scratch"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pyrefly]
project-includes = [
    "botragram",
    "tests",
    "main.py",
]
project-excludes = ["**/.venv*", "scratch"]
python-version = "3.14.0"
preset = "legacy"

[tool.pyrefly.errors]
no-any-return = "error"

