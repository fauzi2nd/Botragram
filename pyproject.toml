[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botragram"
version = "0.1.0"
description = "Asynchronous algorithmic trading framework."
requires-python = ">=3.14"

dependencies = [
    "aiohttp",
    "aiosqlite",
    "python-dotenv",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["botragram", "main.py"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []