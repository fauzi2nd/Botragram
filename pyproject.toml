[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botragram"
version = "0.1.0"
description = "Asynchronous algorithmic trading framework."
requires-python = ">=3.14"

dependencies = [
    "aiohttp",
    "aiosqlite",
    "python-dotenv",
    "python-telegram-bot",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["botragram", "main.py"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["manual"]
cache_dir = ".cache/pytest"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
