name: Authoritative Release Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Authoritative Release Gate (Windows Python 3.14)
    runs-on: [self-hosted, botragram-ci]
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install project and quality dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile sources (compileall)
        id: compile
        continue-on-error: true
        run: python -m compileall -q botragram tests main.py

      - name: Verify entrypoint import (import main)
        id: import_main
        continue-on-error: true
        run: python -c "import main"

      - name: Check formatting (ruff format)
        id: ruff_format
        continue-on-error: true
        run: python -m ruff format --check .

      - name: Lint sources (ruff check)
        id: ruff_lint
        continue-on-error: true
        run: python -m ruff check .

      - name: Strict type-check (pyright)
        id: pyright
        continue-on-error: true
        run: python -m pyright

      - name: Strict type-check (mypy)
        id: mypy
        continue-on-error: true
        run: python -m mypy botragram

      - name: Type diagnostics (pyrefly)
        id: pyrefly
        continue-on-error: true
        run: pyrefly check

      - name: Automated test suite (pytest)
        id: pytest
        continue-on-error: true
        run: python -m pytest

      - name: Git diff whitespace check (git diff --check)
        id: git_diff_check
        continue-on-error: true
        run: git diff --check

      - name: Specialized suite - Position Protection
        id: position_protection
        continue-on-error: true
        run: python -m pytest tests/test_position_protection.py -q

      - name: Specialized suite - Partial TP Hardening
        id: partial_tp
        continue-on-error: true
        run: python -m pytest tests/test_partial_tp_hardening.py -q

      - name: Final Release Gate Evaluation
        id: final_evaluation
        shell: powershell
        run: |
          $gates = [ordered]@{
              "compileall"                 = "${{ steps.compile.outcome }}"
              "import main"                = "${{ steps.import_main.outcome }}"
              "ruff format"                = "${{ steps.ruff_format.outcome }}"
              "ruff lint"                  = "${{ steps.ruff_lint.outcome }}"
              "pyright"                    = "${{ steps.pyright.outcome }}"
              "mypy"                       = "${{ steps.mypy.outcome }}"
              "pyrefly"                    = "${{ steps.pyrefly.outcome }}"
              "pytest"                     = "${{ steps.pytest.outcome }}"
              "git diff --check"           = "${{ steps.git_diff_check.outcome }}"
              "position protection"        = "${{ steps.position_protection.outcome }}"
              "partial TP hardening"       = "${{ steps.partial_tp.outcome }}"
          }

          $hasFailure = $false
          Write-Host "============================================================"
          Write-Host "BOTRAGRAM RELEASE GATE"
          Write-Host "============================================================"

          foreach ($name in $gates.Keys) {
              $outcome = $gates[$name]
              if ($outcome -eq "success") {
                  $status = "PASS"
              } else {
                  $status = "FAIL"
                  $hasFailure = $true
              }
              Write-Host ("{0,-26} {1}" -f $name, $status)
          }

          Write-Host "------------------------------------------------------------"
          if ($hasFailure) {
              Write-Host ("{0,-26} {1}" -f "FINAL RELEASE GATE", "FAIL")
              Write-Host "============================================================"
              Write-Error "Release gate verification failed. One or more mandatory gates did not pass."
              exit 1
          } else {
              Write-Host ("{0,-26} {1}" -f "FINAL RELEASE GATE", "PASS")
              Write-Host "============================================================"
          }
