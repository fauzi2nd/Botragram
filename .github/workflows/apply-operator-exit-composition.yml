name: Apply Operator Exit Telegram UX

on:
  push:
    branches:
      - automation/operator-exit-wiring
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: operator-exit-telegram-ux
  cancel-in-progress: true

jobs:
  apply:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Check out helper branch
        uses: actions/checkout@v5
        with:
          path: helper

      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/operator-exit-control-plane
          path: target
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Apply reviewed Telegram UX patch
        run: |
          python helper/.dev/fix_operator_exit_telegram_ux_runner.py
          python helper/.dev/apply_operator_exit_telegram_ux.py target
          python helper/.dev/repair_operator_exit_telegram_callbacks.py target

      - name: Install project and quality dependencies
        working-directory: target
        run: python -m pip install -e ".[dev]"

      - name: Normalize generated changes
        working-directory: target
        run: |
          python -m ruff format .
          python -m ruff check --fix .
          python -m ruff format .

      - name: Compile sources
        working-directory: target
        run: python -m compileall -q botragram tests main.py

      - name: Import application entry point
        working-directory: target
        run: |
          python -c "import main; print('import main: PASS')"

      - name: Check formatting
        working-directory: target
        run: python -m ruff format --check .

      - name: Lint
        working-directory: target
        run: python -m ruff check .

      - name: Type-check with Pyright
        working-directory: target
        run: python -m pyright

      - name: Type-check with MyPy
        working-directory: target
        run: python -m mypy botragram

      - name: Run tests
        working-directory: target
        run: python -m pytest

      - name: Check diff integrity
        working-directory: target
        run: git diff --check

      - name: Commit and push Telegram UX
        working-directory: target
        run: |
          git config user.name "Fauzi Pranata"
          git config user.email "spacetone2nd@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add operator exit Telegram controls"
          git push origin HEAD:feature/operator-exit-control-plane
