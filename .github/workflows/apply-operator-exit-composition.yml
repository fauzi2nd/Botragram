name: Validate Durable Operator Exit Scope

on:
  push:
    branches:
      - automation/operator-exit-wiring
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: durable-operator-exit-scope
  cancel-in-progress: true

jobs:
  apply:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Check out helper branch
        uses: actions/checkout@v5
        with:
          path: helper

      - name: Check out operator-exit branch
        uses: actions/checkout@v5
        with:
          ref: feature/operator-exit-control-plane
          path: target-${{ github.run_id }}
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Apply durable confirmation-scope patch
        run: python helper/.dev/apply_operator_exit_recovery_hardening.py "target-${{ github.run_id }}"

      - name: Normalize generated SQLite column layout
        run: python helper/.dev/fix_operator_exit_scope_layout.py "target-${{ github.run_id }}"

      - name: Install project and quality dependencies
        working-directory: target-${{ github.run_id }}
        run: python -m pip install -e ".[dev]"

      - name: Normalize generated changes
        working-directory: target-${{ github.run_id }}
        run: |
          python -m ruff format .
          python -m ruff check --fix .
          python -m ruff format .

      - name: Compile sources
        working-directory: target-${{ github.run_id }}
        run: python -m compileall -q botragram tests main.py

      - name: Import application entry point
        working-directory: target-${{ github.run_id }}
        run: |
          python -c "import main; print('import main: PASS')"

      - name: Check formatting
        working-directory: target-${{ github.run_id }}
        run: python -m ruff format --check .

      - name: Lint
        working-directory: target-${{ github.run_id }}
        run: python -m ruff check .

      - name: Type-check with Pyright
        working-directory: target-${{ github.run_id }}
        run: python -m pyright

      - name: Type-check with MyPy
        working-directory: target-${{ github.run_id }}
        run: python -m mypy botragram

      - name: Run tests
        working-directory: target-${{ github.run_id }}
        run: python -m pytest

      - name: Check diff integrity
        working-directory: target-${{ github.run_id }}
        run: git diff --check

      - name: Commit and push durable confirmation scope
        working-directory: target-${{ github.run_id }}
        run: |
          git config user.name "Fauzi Pranata"
          git config user.email "spacetone2nd@gmail.com"
          git add botragram/models/operator_exit.py botragram/services/operator_exit_service.py botragram/storage/sqlite/migrations.py botragram/storage/sqlite/operator_exit_repository.py tests/test_operator_exit_repository.py tests/test_operator_exit_service.py
          git diff --cached --check
          git commit -m "fix: bind operator exits to confirmed scope"
          git push origin HEAD:feature/operator-exit-control-plane
