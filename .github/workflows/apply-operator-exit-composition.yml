name: Apply Operator Exit Composition

on:
  push:
    branches:
      - automation/operator-exit-wiring
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Check out helper branch
        uses: actions/checkout@v5
      - name: Verify helper workflow
        run: python --version
