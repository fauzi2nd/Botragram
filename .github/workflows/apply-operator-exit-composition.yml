name: Validate Hardened Operator Exit Against Main

on:
  push:
    branches:
      - automation/operator-exit-wiring
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hardened-operator-exit-current-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Check out operator-exit branch
        uses: actions/checkout@v5
        with:
          ref: feature/operator-exit-control-plane
          path: target-${{ github.run_id }}
          fetch-depth: 0

      - name: Merge current main in validation workspace only
        working-directory: target-${{ github.run_id }}
        run: |
          git fetch origin main
          git -c user.name="Botragram Validation" -c user.email="validation@local.invalid" merge --no-commit --no-ff origin/main

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install project and quality dependencies
        working-directory: target-${{ github.run_id }}
        run: python -m pip install -e ".[dev]"

      - name: Compile sources
        working-directory: target-${{ github.run_id }}
        run: python -m compileall -q botragram tests main.py

      - name: Import application entry point
        working-directory: target-${{ github.run_id }}
        run: |
          python -c "import main; print('import main: PASS')"

      - name: Check formatting
        working-directory: target-${{ github.run_id }}
        run: python -m ruff format --check .

      - name: Lint
        working-directory: target-${{ github.run_id }}
        run: python -m ruff check .

      - name: Type-check with Pyright
        working-directory: target-${{ github.run_id }}
        run: python -m pyright

      - name: Type-check with MyPy
        working-directory: target-${{ github.run_id }}
        run: python -m mypy botragram

      - name: Run tests
        working-directory: target-${{ github.run_id }}
        run: python -m pytest

      - name: Check feature diff integrity
        working-directory: target-${{ github.run_id }}
        run: git diff --check origin/main...HEAD
