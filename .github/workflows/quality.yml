name: Supplemental Quality (Non-Blocking)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supplemental-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Supplemental Python 3.14
    runs-on: self-hosted
    env:
      TAR_PATH: 'C:\Windows\System32\tar.exe'
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install project and quality dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile sources
        run: python -m compileall -q botragram tests main.py

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type-check with Pyright
        run: python -m pyright

      - name: Type-check with MyPy
        run: python -m mypy botragram

      - name: Run tests
        run: python -m pytest
